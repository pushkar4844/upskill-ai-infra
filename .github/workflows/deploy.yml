# Optional: build and deploy with GitHub Actions instead of `npm run deploy`.
# Needs: repository secret SITE_USERS ("user:password;user2:password2") and
#        Settings -> Pages -> Source: GitHub Actions.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check links
        env:
          SITE_USERS: ${{ secrets.SITE_USERS }}
        run: |
          if [ -z "$SITE_USERS" ]; then echo "::error::Add the SITE_USERS repository secret first (see docs/AUTH.md)"; exit 1; fi
          node tools/check.mjs
      - name: Build
        env:
          SITE_USERS: ${{ secrets.SITE_USERS }}
        run: node src/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
